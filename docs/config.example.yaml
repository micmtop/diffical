# Diffical UTAU Engine 配置

model:
  # pc-nsf-hifigan 官方权重（只读；不替换、不训练、不改 hash）
  vocoder_path: "./models/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/model.onnx"
  vocoder_config_path: "./models/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/config.json"
  model_type: "onnx"

  # hnsep CascadedNet
  hnsep_model_path: "./models/hnsep/vr/model.pt"
  hnsep_config_path: "./models/hnsep/vr/config.yaml"


  contentvec_model_path: "./models/contentvec/"

  # 设备
  device: "cpu"  # "cpu", "cuda", "mps"
  use_onnx: true

audio:
  sample_rate: 44100
  win_size: 2048
  hop_size: 512           # vocoder 帧移（必须与模型训练一致）
  origin_hop_size: 128    # mel 提取用的更细 hop（用于时间拉伸）
  n_fft: 2048
  n_mels: 128
  mel_fmin: 40.0
  mel_fmax: 16000.0

processing:
  # 响度归一化
  wave_norm: true
  trim_silence: true
  silence_threshold: -52.0  # dB

  # 拼接
  crossfade_ms: 30.0  # legacy/debug；生产 overlap 的时长/位置由 OpenUtau envelope 决定
  mel_coherence_width: 0.08  # 越小越早转等功率谱交接；不改 F0、不做相位平滑
  mel_max_compensation_db: 3.01029995664  # 仅约束中性 overlap 的插值能量补偿，不是 limiter
  phase_align: true    # 相位对齐

  # 缓存
  use_cache: true
  cache_dir: "./cache/"

  # 极致音质模式
  ultra_quality: true

server:
  host: "127.0.0.1"
  port: 8573  # 与 同类重采样器 的 8572 错开
  max_workers: 2  # 推理线程池大小
